services:
  web:
    build: .
    ports:
      - "80:8000"
    environment:
      - PORT=8000
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-django-secret-key}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - DATABASE_URL=${DATABASE_URL:-}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-}
    restart: always
    mem_limit: 450m
    memswap_limit: 450m
