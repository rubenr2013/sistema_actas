# Configuración para Railway/Nixpacks
# El proyecto Django está en la subcarpeta sistema_actas/

[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = ["cd sistema_actas && pip install -r requirements.txt"]

[phases.build]
cmds = [
    "cd sistema_actas && python manage.py collectstatic --noinput"
]

[start]
cmd = "cd sistema_actas && gunicorn sistema_actas.wsgi --log-file -"

[variables]
PYTHONUNBUFFERED = "1"
