<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso denegado | Sistema de Actas SENA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .error-code { font-size: 7rem; font-weight: 800; color: #dee2e6; line-height: 1; }
        .error-icon { font-size: 3rem; color: #dc3545; }
        .brand-bar { background: #1a7a3b; padding: 12px 24px; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <div class="brand-bar d-flex align-items-center gap-2">
        <span class="text-white fw-bold fs-5">Sistema de Gestión de Actas</span>
        <span class="text-white-50 small">— Centro Minero SENA</span>
    </div>

    <div class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
        <div class="text-center px-4" style="max-width: 520px;">
            <div class="error-code">403</div>
            <div class="error-icon my-3">
                <i class="fas fa-lock"></i>
            </div>
            <h3 class="fw-semibold mb-2">Acceso denegado</h3>
            <p class="text-muted mb-4">
                No tienes permiso para acceder a esta sección.<br>
                Si crees que esto es un error, contacta al administrador del sistema.
            </p>
            <div class="d-flex gap-2 justify-content-center flex-wrap">
                <a href="/" class="btn btn-success px-4">
                    <i class="fas fa-home me-2"></i>Ir al inicio
                </a>
                <button onclick="history.back()" class="btn btn-outline-secondary px-4">
                    <i class="fas fa-arrow-left me-2"></i>Volver atrás
                </button>
            </div>
        </div>
    </div>

    <footer class="text-center text-muted small py-3 border-top">
        Sistema de Gestión de Actas — Centro Minero SENA &copy; 2026
    </footer>

</body>
</html>
