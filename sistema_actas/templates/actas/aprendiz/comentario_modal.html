    <div class="modal fade" id="rechazoModal" tabindex="-1" aria-labelledby="rechazoModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content border-danger">
        <div class="modal-header bg-danger text-white">
            <h5 class="modal-title" id="rechazoModalLabel">
            <i class="fas fa-exclamation-triangle me-2"></i> Rechazar Acta
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
            <p>¿Deseas rechazar esta acta? Indica el motivo del rechazo.</p>
            <textarea id="motivoRechazo" class="form-control" rows="3" placeholder="Motivo del rechazo..."></textarea>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-danger" id="confirmarRechazo">Rechazar Acta</button>
        </div>
        </div>
        </div>
</div>

<script>
document.getElementById('confirmarRechazo').addEventListener('click', function() {
    const motivo = document.getElementById('motivoRechazo').value.trim();
    if (!motivo) {
        alert('Por favor, indica el motivo del rechazo.');
        return;
    }

    const form = document.getElementById('firmaForm');
    const comentarios = document.getElementById('comentarios');
    comentarios.value = motivo;
    form.submit();
});
</script>
