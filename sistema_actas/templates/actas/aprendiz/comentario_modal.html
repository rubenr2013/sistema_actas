    <div class="modal fade" id="rechazoModal" tabindex="-1" aria-labelledby="rechazoModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content border-danger">
        <div class="modal-header bg-danger text-white">
            <h5 class="modal-title" id="rechazoModalLabel">
            <i class="fas fa-exclamation-triangle me-2"></i> Rechazar Acta
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
            <p>¿Deseas rechazar esta acta? Indica el motivo del rechazo.</p>
            <textarea id="motivoRechazo" class="form-control" rows="3" placeholder="Motivo del rechazo..."></textarea>
            <div id="motivoRechazoError" class="alert alert-danger mt-2 py-2 d-none">
                <i class="fas fa-exclamation-circle me-1"></i>Por favor, indica el motivo del rechazo.
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-danger" id="confirmarRechazo">Rechazar Acta</button>
        </div>
        </div>
        </div>
</div>

<script>
document.getElementById('confirmarRechazo').addEventListener('click', function() {
    const motivo = document.getElementById('motivoRechazo').value.trim();
    const errDiv = document.getElementById('motivoRechazoError');
    if (!motivo) {
        errDiv.classList.remove('d-none');
        document.getElementById('motivoRechazo').classList.add('is-invalid');
        return;
    }
    errDiv.classList.add('d-none');
    document.getElementById('motivoRechazo').classList.remove('is-invalid');

    const form = document.getElementById('firmaForm');
    const comentarios = document.getElementById('comentarios');
    comentarios.value = motivo;
    form.submit();
});
</script>
