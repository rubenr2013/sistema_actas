{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copia de Seguridad | Sistema de Actas</title>

    <!-- Bootstrap para estilos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Poppins', sans-serif;
        }
        .container {
            margin-top: 100px;
            max-width: 600px;
            text-align: center;
        }
        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            background-color: #ffffff;
            padding: 40px;
        }
        .btn-backup {
            background-color: #198754;
            color: white;
            font-weight: 600;
            border-radius: 10px;
            transition: 0.3s;
        }
        .btn-backup:hover {
            background-color: #157347;
        }
        .spinner-border {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2 class="mb-3 text-success">Copia de Seguridad</h2>
        <p class="text-muted">Aquí puedes generar una copia de seguridad de la base de datos del sistema de actas.</p>

        <form method="POST" id="backupForm">
            {% csrf_token %}
            <button type="submit" class="btn btn-backup mt-3" id="backupBtn">
                <span id="btnText">Generar Backup</span>
                <div class="spinner-border spinner-border-sm text-light ms-2" id="spinner" role="status"></div>
            </button>
        </form>

        {% if mensaje %}
        <div class="alert alert-success mt-4">
            {{ mensaje }}
        </div>
        {% elif error %}
        <div class="alert alert-danger mt-4">
            {{ error }}
        </div>
        {% endif %}
    </div>
</div>

<!-- JS para manejar el loading -->
<script>
document.getElementById("backupForm").addEventListener("submit", function() {
    document.getElementById("spinner").style.display = "inline-block";
    document.getElementById("btnText").textContent = "Generando...";
    document.getElementById("backupBtn").disabled = true;
});
</script>

</body>
</html>
